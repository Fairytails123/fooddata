<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fairy Tails K9 Centre — Boarding Feeding Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       Fairy Tails K9 Centre — Boarding Feeding Board
       Standalone display for 43" 4K Toshiba TV (landscape)
       Staff-facing: optimised for readability at 2-3m distance
       ============================================================ */

    :root {
      --ft-primary: #00acee;
      --ft-primary-dark: #007ba8;
      --ft-gradient: linear-gradient(135deg, #00acee 0%, #007ba8 100%);
      --ft-bg: #F0F4F8;
      --ft-card-bg: #FFFFFF;
      --ft-text: #1a2332;
      --ft-text-secondary: #5a6a7e;
      --ft-border: #e2e8f0;
      --ft-shadow: 0 2px 12px rgba(0, 60, 100, 0.08);
      --ft-shadow-lg: 0 8px 32px rgba(0, 60, 100, 0.12);

      /* Food type colours */
      --ft-kibble: #D97706;
      --ft-kibble-bg: #FEF3C7;
      --ft-wet: #0891B2;
      --ft-wet-bg: #CFFAFE;
      --ft-tin: #7C3AED;
      --ft-tin-bg: #EDE9FE;
      --ft-parent: #059669;
      --ft-parent-bg: #D1FAE5;
      --ft-special: #DC2626;
      --ft-special-bg: #FEE2E2;

      /* Alert colours */
      --ft-med-red: #DC2626;
      --ft-med-red-bg: #FEE2E2;
      --ft-med-red-border: #FECACA;
      --ft-no-match: #F59E0B;
      --ft-no-match-bg: #FFFBEB;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow-x: hidden;
      background: var(--ft-bg);
      font-family: 'Nunito', sans-serif;
      color: var(--ft-text);
      -webkit-font-smoothing: antialiased;
    }

    /* --- Page Layout --- */
    .page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 28px 36px 20px;
    }

    /* --- Header --- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: var(--ft-shadow);
    }

    .header-title h1 {
      font-size: 30px;
      font-weight: 900;
      background: var(--ft-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    .header-title .subtitle {
      font-size: 14px;
      font-weight: 700;
      color: var(--ft-text-secondary);
      margin-top: 2px;
      letter-spacing: 0.3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .dog-count-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--ft-gradient);
      color: #fff;
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      color: var(--ft-primary-dark);
      padding: 10px 20px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 700;
      border: 2px solid var(--ft-primary);
    }

    .update-info {
      font-size: 12px;
      color: var(--ft-text-secondary);
      font-weight: 600;
      text-align: right;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
      margin-right: 4px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* --- Cards Grid --- */
    .cards-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
      align-content: start;
    }

    /* --- Individual Dog Card --- */
    .dog-card {
      background: var(--ft-card-bg);
      border-radius: 18px;
      box-shadow: var(--ft-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s ease;
    }

    .fade-in {
      animation: cardFadeIn 0.4s ease both;
      opacity: 0;
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Card header — dog name bar */
    .card-header {
      background: var(--ft-gradient);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-header .dog-identity {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-header .paw-icon {
      width: 34px;
      height: 34px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-header .paw-icon svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    .card-header .dog-name {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
    }

    .card-header .owner-name {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.75);
    }

    .meals-badge {
      background: rgba(255,255,255,0.2);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    /* Card body */
    .card-body {
      padding: 16px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    /* Food type tags */
    .food-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .food-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
    }

    .food-tag svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .food-tag.kibble { background: var(--ft-kibble-bg); color: var(--ft-kibble); }
    .food-tag.wet { background: var(--ft-wet-bg); color: var(--ft-wet); }
    .food-tag.tin { background: var(--ft-tin-bg); color: var(--ft-tin); }
    .food-tag.parent { background: var(--ft-parent-bg); color: var(--ft-parent); }
    .food-tag.special { background: var(--ft-special-bg); color: var(--ft-special); }

    /* Quantity detail row */
    .quantity-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 8px 14px;
      background: #F8FAFC;
      border-radius: 10px;
      border-left: 4px solid var(--ft-primary);
    }

    .quantity-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--ft-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      min-width: 80px;
    }

    .quantity-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--ft-text);
    }

    /* Special notes */
    .notes-block {
      padding: 10px 14px;
      background: #FFFBEB;
      border-radius: 10px;
      border-left: 4px solid #F59E0B;
    }

    .notes-label {
      font-size: 11px;
      font-weight: 800;
      color: #92400E;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .notes-text {
      font-size: 15px;
      font-weight: 600;
      color: #78350F;
      line-height: 1.4;
    }

    /* Medication alert */
    .med-alert {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      background: var(--ft-med-red-bg);
      border: 2px solid var(--ft-med-red-border);
      border-radius: 12px;
      animation: alertPulse 3s ease-in-out infinite;
    }

    @keyframes alertPulse {
      0%, 100% { border-color: #FECACA; }
      50% { border-color: #F87171; }
    }

    .med-alert-icon {
      width: 28px;
      height: 28px;
      background: var(--ft-med-red);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .med-alert-icon svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    .med-alert-content { flex: 1; }

    .med-alert-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--ft-med-red);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .med-alert-text {
      font-size: 14px;
      font-weight: 600;
      color: #991B1B;
      line-height: 1.4;
      margin-top: 2px;
    }

    /* No match warning */
    .no-match-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: var(--ft-no-match-bg);
      border: 2px dashed #FCD34D;
      border-radius: 12px;
    }

    .no-match-banner svg {
      width: 24px;
      height: 24px;
      fill: var(--ft-no-match);
      flex-shrink: 0;
    }

    .no-match-banner .no-match-text {
      font-size: 15px;
      font-weight: 700;
      color: #92400E;
    }

    /* --- Error Banner --- */
    .error-banner {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 12px;
      padding: 16px 24px;
      margin-bottom: 16px;
      color: #991B1B;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    /* --- Feeding warning banner (JotForm errors) --- */
    .feeding-warning {
      background: #FFFBEB;
      border: 1px solid #FCD34D;
      border-radius: 12px;
      padding: 12px 24px;
      margin-bottom: 16px;
      color: #92400E;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    /* --- Footer --- */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid var(--ft-border);
      flex-shrink: 0;
    }

    .footer-left {
      font-size: 13px;
      font-weight: 600;
      color: var(--ft-text-secondary);
    }

    .footer-right {
      font-size: 13px;
      font-weight: 600;
      color: var(--ft-text-secondary);
    }

    .countdown {
      font-weight: 800;
      color: var(--ft-primary);
    }

    /* --- Loading State --- */
    .loading-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 20px;
      gap: 20px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--ft-border);
      border-top-color: var(--ft-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 16px;
      font-weight: 700;
      color: var(--ft-text-secondary);
    }

    /* --- Empty State --- */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 20px;
      gap: 16px;
      color: var(--ft-text-secondary);
    }

    .empty-state svg {
      width: 56px;
      height: 56px;
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <img src="https://i.ibb.co/whdBKp0L/Logo-1.jpg" alt="Fairy Tails K9 Centre" class="logo">
        <div class="header-title">
          <h1>Boarding Feeding Board</h1>
          <div class="subtitle">Meal requirements for all boarding dogs</div>
        </div>
      </div>
      <div class="header-right">
        <div class="dog-count-badge" id="dogCountBadge">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="8" cy="6.5" rx="2.2" ry="2.8"/><ellipse cx="16" cy="6.5" rx="2.2" ry="2.8"/><ellipse cx="4.5" cy="11.5" rx="2" ry="2.5"/><ellipse cx="19.5" cy="11.5" rx="2" ry="2.5"/><path d="M12 22c-3.5 0-6.5-2.5-7-5.5-.3-1.8.5-3.5 2-4.5 1-.7 2.2-1 3.3-1h3.4c1.1 0 2.3.3 3.3 1 1.5 1 2.3 2.7 2 4.5-.5 3-3.5 5.5-7 5.5z"/></svg>
          <span id="dogCountText">— Dogs</span>
        </div>
        <div class="date-badge" id="dateRangeBadge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="dateRangeText">Loading...</span>
        </div>
        <div class="update-info">
          <span class="status-dot"></span>
          Updated: <span id="lastUpdated">—</span>
        </div>
      </div>
    </div>

    <!-- Error Banner (hidden by default) -->
    <div class="error-banner" id="errorBanner"></div>

    <!-- Feeding Warning Banner (JotForm errors — hidden by default) -->
    <div class="feeding-warning" id="feedingWarning"></div>

    <!-- Loading State -->
    <div class="loading-overlay" id="loadingState">
      <div class="spinner"></div>
      <div class="loading-text">Fetching boarding &amp; feeding data...</div>
    </div>

    <!-- Cards Grid (hidden initially) -->
    <div class="cards-grid" id="cardsGrid" style="display:none;"></div>

    <!-- Empty State (hidden initially) -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      <p>No boarding stays in the next 7 days</p>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="footer-left">
        Fairy Tails K9 Centre — Boarding Feeding Board
      </div>
      <div class="footer-right">
        Next refresh in: <span class="countdown" id="countdown">—</span>
      </div>
    </div>

  </div>

  <script>
    // ============================================================
    // CONFIGURATION
    // Paste your deployed Apps Script web app URL below.
    // The ?mode=feeding parameter is appended automatically.
    // ============================================================
    var API_URL = 'https://script.google.com/macros/s/AKfycbz2kc3lJbrGk7lw9jVcZMdUrPWjRx4qBARM8YVAIARhYAlQwCzlhHBbKswyOcVHytmB7Q/exec';

    // Refresh every 1 hour (feeding data changes less often than bookings)
    var REFRESH_INTERVAL_MS = 1 * 60 * 60 * 1000;
    var nextRefreshTime = null;
    var countdownTimer = null;

    var DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                       'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];


    // ============================================================
    // DATE HELPERS
    // ============================================================

    function parseDate(dateStr) {
      var parts = dateStr.split('-');
      return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    }

    function formatDateRange(start, end) {
      var s = parseDate(start);
      var e = parseDate(end);
      return s.getDate() + ' ' + MONTH_NAMES[s.getMonth()] + ' — ' +
             e.getDate() + ' ' + MONTH_NAMES[e.getMonth()] + ' ' + e.getFullYear();
    }

    function formatLastUpdated(isoStr) {
      var d = new Date(isoStr);
      var hours = d.getHours();
      var mins = ('0' + d.getMinutes()).slice(-2);
      var ampm = hours >= 12 ? 'pm' : 'am';
      hours = hours % 12 || 12;
      return hours + ':' + mins + ampm + ', ' +
             DAY_NAMES[d.getDay()] + ' ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()];
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }


    // ============================================================
    // SVG ICONS
    // ============================================================

    function pawIconSVG() {
      return '<svg viewBox="0 0 24 24"><ellipse cx="8" cy="6.5" rx="2.2" ry="2.8"/>' +
        '<ellipse cx="16" cy="6.5" rx="2.2" ry="2.8"/>' +
        '<ellipse cx="4.5" cy="11.5" rx="2" ry="2.5"/>' +
        '<ellipse cx="19.5" cy="11.5" rx="2" ry="2.5"/>' +
        '<path d="M12 22c-3.5 0-6.5-2.5-7-5.5-.3-1.8.5-3.5 2-4.5 1-.7 2.2-1 3.3-1h3.4c1.1 0 2.3.3 3.3 1 1.5 1 2.3 2.7 2 4.5-.5 3-3.5 5.5-7 5.5z"/></svg>';
    }

    // Food type → { icon SVG, CSS class, display label }
    var FOOD_TYPE_MAP = {
      'Kibble': {
        cls: 'kibble',
        label: 'Kibble',
        icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7 2 3 6 3 11c0 3 1.5 5.5 4 7v2c0 .6.4 1 1 1h8c.6 0 1-.4 1-1v-2c2.5-1.5 4-4 4-7 0-5-4-9-9-9zm-1 15h-1v-2h1v2zm3 0h-1v-2h1v2zm1.5-4.5c-.8.5-1.5 1-1.5 1.5h-4c0-.5-.7-1-1.5-1.5C7.5 12 7 10.5 7 9.5 7 7 9.2 5 12 5s5 2 5 4.5c0 1-.5 2.5-1.5 3z"/></svg>'
      },
      'Wet Food - Sachet/Tray': {
        cls: 'wet',
        label: 'Wet — Sachet',
        icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7z"/><circle cx="12" cy="12" r="4"/></svg>'
      },
      'Wet Food - Tin': {
        cls: 'tin',
        label: 'Wet — Tin',
        icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.1 2 5 3.3 5 5v14c0 1.7 3.1 3 7 3s7-1.3 7-3V5c0-1.7-3.1-3-7-3zm0 2c3.3 0 5 .9 5 1s-1.7 1-5 1-5-.9-5-1 1.7-1 5-1zm5 15c0 .1-1.7 1-5 1s-5-.9-5-1V7.9c1.2.7 3 1.1 5 1.1s3.8-.4 5-1.1V19z"/></svg>'
      },
      'Pre-Portioned by parents': {
        cls: 'parent',
        label: 'Pre-Portioned by Parents',
        icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 12 7.4l3.38 4.6L17 10.83 14.92 8H20v6z"/></svg>'
      },
      'Special Requirements': {
        cls: 'special',
        label: 'Special Requirements',
        icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 21h22L12 2zm0 4l7.5 13h-15L12 6zm-1 6v4h2v-4h-2zm0 5v2h2v-2h-2z"/></svg>'
      }
    };

    var medIconSVG = '<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>';

    var warningIconSVG = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>';


    // ============================================================
    // CARD BUILDERS
    // ============================================================

    /**
     * Builds the HTML for food type tag badges.
     * @param {Array} foodTypes - Array of food type strings from JotForm
     * @return {string} HTML string of food tags
     */
    function buildFoodTags(foodTypes) {
      if (!foodTypes || foodTypes.length === 0) return '';

      var html = '<div class="food-tags">';
      for (var i = 0; i < foodTypes.length; i++) {
        var type = foodTypes[i];
        var info = FOOD_TYPE_MAP[type];

        if (info) {
          html += '<span class="food-tag ' + info.cls + '">' +
                    info.icon +
                    escapeHtml(info.label) +
                  '</span>';
        } else {
          // Unknown food type — show as special
          html += '<span class="food-tag special">' +
                    FOOD_TYPE_MAP['Special Requirements'].icon +
                    escapeHtml(type) +
                  '</span>';
        }
      }
      html += '</div>';
      return html;
    }

    /**
     * Builds quantity detail rows (kibble, wet food, tin).
     * @param {Object} feeding - The feeding data object
     * @return {string} HTML string of quantity rows
     */
    function buildQuantityRows(feeding) {
      var html = '';

      // Kibble summary (pre-built on server side)
      if (feeding.kibbleSummary) {
        html += '<div class="quantity-row">' +
                  '<span class="quantity-label">Kibble</span>' +
                  '<span class="quantity-value">' + escapeHtml(feeding.kibbleSummary) + '</span>' +
                '</div>';
      }

      // Wet food — pouch/tray
      if (feeding.wetFood) {
        html += '<div class="quantity-row">' +
                  '<span class="quantity-label">Wet</span>' +
                  '<span class="quantity-value">' + escapeHtml(feeding.wetFood) + '</span>' +
                '</div>';
      }

      // Wet food — tin
      if (feeding.tinFood) {
        html += '<div class="quantity-row">' +
                  '<span class="quantity-label">Tin</span>' +
                  '<span class="quantity-value">' + escapeHtml(feeding.tinFood) + '</span>' +
                '</div>';
      }

      return html;
    }

    /**
     * Builds the special notes block if present.
     * @param {string} notes - Special notes text
     * @return {string} HTML string
     */
    function buildNotesBlock(notes) {
      if (!notes) return '';
      return '<div class="notes-block">' +
               '<div class="notes-label">Special Instructions</div>' +
               '<div class="notes-text">' + escapeHtml(notes) + '</div>' +
             '</div>';
    }

    /**
     * Builds the medication alert block if medication is required.
     * @param {Object} feeding - The feeding data object
     * @return {string} HTML string
     */
    function buildMedAlert(feeding) {
      if (!feeding || feeding.medication !== 'Yes') return '';

      var details = feeding.medicationDetails || 'See medication bag / check with owner';

      return '<div class="med-alert">' +
               '<div class="med-alert-icon">' + medIconSVG + '</div>' +
               '<div class="med-alert-content">' +
                 '<div class="med-alert-title">\u2695 Medication Required</div>' +
                 '<div class="med-alert-text">' + escapeHtml(details) + '</div>' +
               '</div>' +
             '</div>';
    }

    /**
     * Builds a "no match found" warning for dogs without feeding records.
     * @return {string} HTML string
     */
    function buildNoMatchBanner() {
      return '<div class="no-match-banner">' +
               warningIconSVG +
               '<span class="no-match-text">No feeding record found — check JotForm or ask owner</span>' +
             '</div>';
    }

    /**
     * Formats the meals per day string for the badge.
     * "Two Meals" → "2 MEALS / DAY"
     * @param {string} mealsStr - The raw meals string from JotForm
     * @return {string} Formatted badge text
     */
    function formatMealsBadge(mealsStr) {
      if (!mealsStr) return '— MEALS';

      var lower = mealsStr.toLowerCase();
      var num = '?';
      if (lower.indexOf('one') !== -1 || lower.indexOf('1') !== -1) num = '1';
      else if (lower.indexOf('two') !== -1 || lower.indexOf('2') !== -1) num = '2';
      else if (lower.indexOf('three') !== -1 || lower.indexOf('3') !== -1) num = '3';

      return num + ' MEAL' + (num !== '1' ? 'S' : '') + ' / DAY';
    }

    /**
     * Builds a complete dog card HTML.
     * @param {Object} dog - Dog data object from the API
     * @param {number} index - Card index for staggered animation
     * @return {string} Complete card HTML
     */
    function buildDogCard(dog, index) {
      var delay = index * 60;
      var feeding = dog.feeding;

      // Card header
      var html = '<div class="dog-card fade-in" style="animation-delay:' + delay + 'ms;">';

      // Header bar
      html += '<div class="card-header">' +
                '<div class="dog-identity">' +
                  '<div class="paw-icon">' + pawIconSVG() + '</div>' +
                  '<div>' +
                    '<div class="dog-name">' + escapeHtml(dog.dogName) + '</div>' +
                    (dog.ownerSurname
                      ? '<div class="owner-name">' + escapeHtml(dog.ownerSurname) + '</div>'
                      : '') +
                  '</div>' +
                '</div>' +
                '<div class="meals-badge">' +
                  (feeding ? formatMealsBadge(feeding.mealsPerDay) : '— MEALS') +
                '</div>' +
              '</div>';

      // Card body
      html += '<div class="card-body">';

      if (dog.matched && feeding) {
        // Food type tags
        html += buildFoodTags(feeding.foodTypes);

        // Quantity details
        html += buildQuantityRows(feeding);

        // Special notes
        html += buildNotesBlock(feeding.specialNotes);

        // Medication alert (always last — most visually prominent)
        html += buildMedAlert(feeding);
      } else {
        // No feeding record found
        html += buildNoMatchBanner();
      }

      html += '</div>'; // .card-body
      html += '</div>'; // .dog-card

      return html;
    }


    // ============================================================
    // RENDER
    // ============================================================

    /**
     * Renders the feeding board data into the page.
     * @param {Object} data - API response from ?mode=feeding
     */
    function renderData(data) {
      var loadingEl = document.getElementById('loadingState');
      var gridEl = document.getElementById('cardsGrid');
      var emptyEl = document.getElementById('emptyState');
      var errorEl = document.getElementById('errorBanner');
      var feedingWarnEl = document.getElementById('feedingWarning');
      var dateRangeEl = document.getElementById('dateRangeText');
      var lastUpdatedEl = document.getElementById('lastUpdated');
      var dogCountEl = document.getElementById('dogCountText');

      // Hide loading
      loadingEl.style.display = 'none';

      // Show critical error if present
      if (data.error) {
        errorEl.textContent = data.error;
        errorEl.style.display = 'block';
      } else {
        errorEl.style.display = 'none';
      }

      // Show feeding warning if JotForm had issues
      if (data.feedingError) {
        feedingWarnEl.textContent = data.feedingError;
        feedingWarnEl.style.display = 'block';
      } else {
        feedingWarnEl.style.display = 'none';
      }

      // Update header
      if (data.dateRange && data.dateRange.start && data.dateRange.end) {
        dateRangeEl.textContent = formatDateRange(data.dateRange.start, data.dateRange.end);
      }

      if (data.lastUpdated) {
        lastUpdatedEl.textContent = formatLastUpdated(data.lastUpdated);
      }

      // Update dog count
      var count = (data.dogs && data.dogs.length) || 0;
      dogCountEl.textContent = count + ' Dog' + (count !== 1 ? 's' : '') + ' Boarding';

      // Render cards or empty state
      if (data.dogs && data.dogs.length > 0) {
        gridEl.style.display = 'grid';
        emptyEl.style.display = 'none';

        var html = '';
        for (var i = 0; i < data.dogs.length; i++) {
          html += buildDogCard(data.dogs[i], i);
        }
        gridEl.innerHTML = html;

      } else {
        gridEl.style.display = 'none';
        emptyEl.style.display = 'flex';
      }
    }


    // ============================================================
    // DATA LOADING & REFRESH
    // ============================================================

    /**
     * Fetch feeding board data from the Apps Script API.
     */
    function loadData() {
      var gridEl = document.getElementById('cardsGrid');
      if (!gridEl.innerHTML) {
        document.getElementById('loadingState').style.display = 'flex';
      }

      // Append ?mode=feeding to the API URL
      var fetchUrl = API_URL + (API_URL.indexOf('?') === -1 ? '?' : '&') + 'mode=feeding';

      fetch(fetchUrl)
        .then(function(response) {
          if (!response.ok) {
            throw new Error('HTTP ' + response.status);
          }
          return response.json();
        })
        .then(function(data) {
          renderData(data);
          scheduleNextRefresh();
        })
        .catch(function(err) {
          renderData({
            dogs: [],
            dogCount: 0,
            dateRange: { start: '', end: '' },
            lastUpdated: new Date().toISOString(),
            error: 'Connection error: ' + (err.message || err),
            feedingError: null
          });
          scheduleNextRefresh();
        });
    }

    /**
     * Schedule the next data refresh and start the countdown timer.
     */
    function scheduleNextRefresh() {
      nextRefreshTime = Date.now() + REFRESH_INTERVAL_MS;

      if (countdownTimer) clearInterval(countdownTimer);

      countdownTimer = setInterval(function() {
        var remaining = nextRefreshTime - Date.now();
        if (remaining <= 0) {
          clearInterval(countdownTimer);
          loadData();
          return;
        }

        var hours = Math.floor(remaining / (1000 * 60 * 60));
        var mins = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
        var secs = Math.floor((remaining % (1000 * 60)) / 1000);

        document.getElementById('countdown').textContent =
          (hours > 0 ? hours + 'h ' : '') +
          ('0' + mins).slice(-2) + 'm ' +
          ('0' + secs).slice(-2) + 's';

      }, 1000);
    }

    // --- Initial load ---
    document.addEventListener('DOMContentLoaded', function() {
      loadData();
    });
  </script>
</body>
</html>
