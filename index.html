<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fairy Tails K9 Centre — Boarding Feeding Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       Fairy Tails K9 Centre — Boarding Feeding Board
       Optimised for Hisense 40" 40E4QTUK FHD (1920x1080)
       No-scroll TV dashboard — all data fits one screen
       ============================================================ */

    :root {
      --ft-primary: #00acee;
      --ft-primary-dark: #007ba8;
      --ft-gradient: linear-gradient(135deg, #00acee 0%, #007ba8 100%);
      --ft-bg: #F0F4F8;
      --ft-card-bg: #FFFFFF;
      --ft-text: #1a2332;
      --ft-text-secondary: #5a6a7e;
      --ft-border: #e2e8f0;
      --ft-shadow: 0 1px 6px rgba(0, 60, 100, 0.08);

      --ft-kibble: #D97706;
      --ft-kibble-bg: #FEF3C7;
      --ft-wet: #0891B2;
      --ft-wet-bg: #CFFAFE;
      --ft-tin: #7C3AED;
      --ft-tin-bg: #EDE9FE;
      --ft-parent: #059669;
      --ft-parent-bg: #D1FAE5;
      --ft-special: #DC2626;
      --ft-special-bg: #FEE2E2;

      --ft-med-red: #DC2626;
      --ft-med-red-bg: #FEE2E2;
      --ft-med-red-border: #FECACA;
      --ft-no-match: #F59E0B;
      --ft-no-match-bg: #FFFBEB;

      --ft-school: #8B5CF6;
      --ft-school-dark: #6D28D9;
      --ft-school-gradient: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);

      /* Dynamic layout — set by JS */
      --card-cols: 4;
      --card-rows: 2;
      --card-gap: 10px;
      --fs: 1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--ft-bg);
      font-family: 'Nunito', sans-serif;
      color: var(--ft-text);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      padding: 16px 40px 10px;
    }

    /* --- Header (compact) --- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-shrink: 0;
      height: 56px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
    }

    .header-title h1 {
      font-size: 22px;
      font-weight: 900;
      background: var(--ft-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    .header-title .subtitle {
      font-size: 11px;
      font-weight: 700;
      color: var(--ft-text-secondary);
      margin-top: 1px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dog-count-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--ft-gradient);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
    }

    .date-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      color: var(--ft-primary-dark);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      border: 2px solid var(--ft-primary);
    }

    .update-info {
      font-size: 11px;
      color: var(--ft-text-secondary);
      font-weight: 600;
      text-align: right;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10B981;
      margin-right: 3px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* --- Cards Grid --- */
    .cards-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(var(--card-cols), minmax(0, 1fr));
      grid-template-rows: repeat(var(--card-rows, 2), minmax(0, 1fr));
      gap: var(--card-gap);
      align-content: stretch;
      overflow: hidden;
      min-height: 0;
      max-width: 100%;
    }

    /* --- Dog Card --- */
    .dog-card {
      background: var(--ft-card-bg);
      border-radius: 12px;
      box-shadow: var(--ft-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .card-header {
      background: var(--ft-gradient);
      padding: calc(6px * var(--fs)) calc(10px * var(--fs));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
    }

    .card-header.school {
      background: var(--ft-school-gradient);
    }

    .card-header .dog-identity {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .card-header .paw-icon {
      width: calc(26px * var(--fs));
      height: calc(26px * var(--fs));
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-header .paw-icon svg {
      width: calc(15px * var(--fs));
      height: calc(15px * var(--fs));
      fill: #fff;
    }

    .card-header .dog-name {
      font-size: calc(15px * var(--fs));
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-type-badge {
      display: inline-block;
      font-size: calc(8px * var(--fs));
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(255,255,255,0.25);
      color: #fff;
      margin-left: 4px;
      vertical-align: middle;
    }

    .meals-badge {
      background: rgba(255,255,255,0.2);
      color: #fff;
      padding: calc(3px * var(--fs)) calc(8px * var(--fs));
      border-radius: 12px;
      font-size: calc(10px * var(--fs));
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .card-body {
      padding: calc(6px * var(--fs)) calc(8px * var(--fs)) calc(8px * var(--fs));
      display: flex;
      flex-direction: column;
      gap: calc(4px * var(--fs));
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* Food tags */
    .food-tags {
      display: flex;
      flex-wrap: wrap;
      gap: calc(4px * var(--fs));
    }

    .food-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: calc(2px * var(--fs)) calc(7px * var(--fs));
      border-radius: 6px;
      font-size: calc(10px * var(--fs));
      font-weight: 700;
    }

    .food-tag svg {
      width: calc(12px * var(--fs));
      height: calc(12px * var(--fs));
      flex-shrink: 0;
    }

    .food-tag.kibble { background: var(--ft-kibble-bg); color: var(--ft-kibble); }
    .food-tag.wet { background: var(--ft-wet-bg); color: var(--ft-wet); }
    .food-tag.tin { background: var(--ft-tin-bg); color: var(--ft-tin); }
    .food-tag.parent { background: var(--ft-parent-bg); color: var(--ft-parent); }
    .food-tag.special { background: var(--ft-special-bg); color: var(--ft-special); }

    /* Quantity rows */
    .quantity-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: calc(4px * var(--fs)) calc(8px * var(--fs));
      background: #F8FAFC;
      border-radius: 6px;
      border-left: 3px solid var(--ft-primary);
    }

    .quantity-label {
      font-size: calc(9px * var(--fs));
      font-weight: 700;
      color: var(--ft-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      min-width: 48px;
    }

    .quantity-value {
      font-size: calc(12px * var(--fs));
      font-weight: 800;
      color: var(--ft-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Notes — clamped */
    .notes-block {
      padding: calc(4px * var(--fs)) calc(8px * var(--fs));
      background: #FFFBEB;
      border-radius: 6px;
      border-left: 3px solid #F59E0B;
      overflow: hidden;
    }

    .notes-label {
      font-size: calc(8px * var(--fs));
      font-weight: 800;
      color: #92400E;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 1px;
    }

    .notes-text {
      font-size: calc(11px * var(--fs));
      font-weight: 600;
      color: #78350F;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Medication — compact */
    .med-alert {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: calc(5px * var(--fs)) calc(8px * var(--fs));
      background: var(--ft-med-red-bg);
      border: 2px solid var(--ft-med-red-border);
      border-radius: 8px;
    }

    .med-alert-icon {
      width: calc(20px * var(--fs));
      height: calc(20px * var(--fs));
      background: var(--ft-med-red);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .med-alert-icon svg {
      width: calc(13px * var(--fs));
      height: calc(13px * var(--fs));
      fill: #fff;
    }

    .med-alert-content { flex: 1; min-width: 0; }

    .med-alert-title {
      font-size: calc(10px * var(--fs));
      font-weight: 800;
      color: var(--ft-med-red);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .med-alert-text {
      font-size: calc(10px * var(--fs));
      font-weight: 600;
      color: #991B1B;
      line-height: 1.3;
      margin-top: 1px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* No match */
    .no-match-banner {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: calc(6px * var(--fs)) calc(8px * var(--fs));
      background: var(--ft-no-match-bg);
      border: 1px dashed #FCD34D;
      border-radius: 8px;
    }

    .no-match-banner svg {
      width: calc(16px * var(--fs));
      height: calc(16px * var(--fs));
      fill: var(--ft-no-match);
      flex-shrink: 0;
    }

    .no-match-banner .no-match-text {
      font-size: calc(11px * var(--fs));
      font-weight: 700;
      color: #92400E;
    }

    /* Error / Warning banners */
    .error-banner {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 8px;
      padding: 8px 16px;
      margin-bottom: 8px;
      color: #991B1B;
      font-size: 12px;
      font-weight: 600;
      display: none;
      flex-shrink: 0;
    }

    .feeding-warning {
      background: #FFFBEB;
      border: 1px solid #FCD34D;
      border-radius: 8px;
      padding: 8px 16px;
      margin-bottom: 8px;
      color: #92400E;
      font-size: 12px;
      font-weight: 600;
      display: none;
      flex-shrink: 0;
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--ft-border);
      flex-shrink: 0;
      height: 28px;
    }

    .footer-left, .footer-right {
      font-size: 11px;
      font-weight: 600;
      color: var(--ft-text-secondary);
    }

    .countdown {
      font-weight: 800;
      color: var(--ft-primary);
    }

    /* Loading */
    .loading-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 16px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--ft-border);
      border-top-color: var(--ft-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--ft-text-secondary);
    }

    /* Empty */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      color: var(--ft-text-secondary);
    }

    .empty-state svg { width: 48px; height: 48px; opacity: 0.4; }
    .empty-state p { font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="page">

    <div class="header">
      <div class="header-left">
        <img src="https://i.ibb.co/whdBKp0L/Logo-1.jpg" alt="Fairy Tails K9 Centre" class="logo">
        <div class="header-title">
          <h1>Boarding Feeding Board</h1>
          <div class="subtitle">Today's stays &amp; tomorrow's arrivals</div>
        </div>
      </div>
      <div class="header-right">
        <div class="dog-count-badge" id="dogCountBadge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="8" cy="6.5" rx="2.2" ry="2.8"/><ellipse cx="16" cy="6.5" rx="2.2" ry="2.8"/><ellipse cx="4.5" cy="11.5" rx="2" ry="2.5"/><ellipse cx="19.5" cy="11.5" rx="2" ry="2.5"/><path d="M12 22c-3.5 0-6.5-2.5-7-5.5-.3-1.8.5-3.5 2-4.5 1-.7 2.2-1 3.3-1h3.4c1.1 0 2.3.3 3.3 1 1.5 1 2.3 2.7 2 4.5-.5 3-3.5 5.5-7 5.5z"/></svg>
          <span id="dogCountText">— Dogs</span>
        </div>
        <div class="date-badge" id="dateRangeBadge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="dateRangeText">Loading...</span>
        </div>
        <div class="update-info">
          <span class="status-dot"></span>
          Updated: <span id="lastUpdated">—</span>
        </div>
      </div>
    </div>

    <div class="error-banner" id="errorBanner"></div>
    <div class="feeding-warning" id="feedingWarning"></div>

    <div class="loading-overlay" id="loadingState">
      <div class="spinner"></div>
      <div class="loading-text">Fetching boarding &amp; feeding data...</div>
    </div>

    <div class="cards-grid" id="cardsGrid" style="display:none;"></div>

    <div class="empty-state" id="emptyState" style="display:none;">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      <p>No boarding stays in the next 7 days</p>
    </div>

    <div class="footer">
      <div class="footer-left">Fairy Tails K9 Centre — Boarding Feeding Board</div>
      <div class="footer-right">Next refresh in: <span class="countdown" id="countdown">—</span></div>
    </div>

  </div>

  <script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    var API_URL = 'https://script.google.com/macros/s/AKfycbz2kc3lJbrGk7lw9jVcZMdUrPWjRx4qBARM8YVAIARhYAlQwCzlhHBbKswyOcVHytmB7Q/exec';
    var API_TOKEN = 'ft-k9-board-2024-sec';

    var REFRESH_INTERVAL_MS = 1 * 60 * 60 * 1000;
    var nextRefreshTime = null;
    var countdownTimer = null;

    var DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                       'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];


    // ============================================================
    // DATE HELPERS
    // ============================================================

    function parseDate(dateStr) {
      var parts = dateStr.split('-');
      return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    }

    function formatDateRange(start, end) {
      var s = parseDate(start);
      var e = parseDate(end);
      return s.getDate() + ' ' + MONTH_NAMES[s.getMonth()] + ' — ' +
             e.getDate() + ' ' + MONTH_NAMES[e.getMonth()] + ' ' + e.getFullYear();
    }

    function formatLastUpdated(isoStr) {
      var d = new Date(isoStr);
      var hours = d.getHours();
      var mins = ('0' + d.getMinutes()).slice(-2);
      var ampm = hours >= 12 ? 'pm' : 'am';
      hours = hours % 12 || 12;
      return hours + ':' + mins + ampm + ', ' +
             DAY_NAMES[d.getDay()] + ' ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()];
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }


    // ============================================================
    // DEDUPLICATION
    // ============================================================

    function deduplicateDogs(dogs) {
      var seen = {};
      var result = [];

      for (var i = 0; i < dogs.length; i++) {
        var dog = dogs[i];
        var key = (dog.dogName || '').toLowerCase() + '|' + (dog.ownerSurname || '').toLowerCase();

        if (!seen[key]) {
          seen[key] = { index: result.length, dog: dog };
          result.push(dog);
        } else {
          var existing = seen[key].dog;
          var replaceExisting = false;

          var existingHasMed = existing.feeding && existing.feeding.medication === 'Yes';
          var newHasMed = dog.feeding && dog.feeding.medication === 'Yes';

          if (!existingHasMed && newHasMed) {
            replaceExisting = true;
          } else if (existingHasMed === newHasMed) {
            if (!existing.matched && dog.matched) {
              replaceExisting = true;
            } else if (existing.matched === dog.matched && dog.checkIn > existing.checkIn) {
              replaceExisting = true;
            }
          }

          if (replaceExisting) {
            result[seen[key].index] = dog;
            seen[key].dog = dog;
          }
        }
      }

      return result;
    }


    // ============================================================
    // TODAY + TOMORROW FILTER
    // ============================================================

    /**
     * Filters dogs to only those staying today or arriving tomorrow.
     * - "Staying today": checkIn <= today AND checkOut > today
     * - "Arriving tomorrow": checkIn == tomorrow
     * Dogs whose stay starts after tomorrow are excluded.
     */
    function filterTodayTomorrow(dogs) {
      var now = new Date();
      var todayStr = now.getFullYear() + '-' +
        ('0' + (now.getMonth() + 1)).slice(-2) + '-' +
        ('0' + now.getDate()).slice(-2);

      var tomorrow = new Date(now);
      tomorrow.setDate(tomorrow.getDate() + 1);
      var tomorrowStr = tomorrow.getFullYear() + '-' +
        ('0' + (tomorrow.getMonth() + 1)).slice(-2) + '-' +
        ('0' + tomorrow.getDate()).slice(-2);

      var result = [];
      for (var i = 0; i < dogs.length; i++) {
        var dog = dogs[i];
        var checkIn = dog.checkIn;
        var checkOut = dog.checkOut;

        // Currently staying today (checked in on or before today, checks out after today)
        var stayingToday = (checkIn <= todayStr && checkOut > todayStr);

        // Arriving tomorrow
        var arrivingTomorrow = (checkIn === tomorrowStr);

        if (stayingToday || arrivingTomorrow) {
          // Tag the dog so the card can show context
          dog._arrivalLabel = arrivingTomorrow && !stayingToday ? 'tomorrow' : 'today';
          result.push(dog);
        }
      }

      return result;
    }

    /**
     * Formats "Today & Tomorrow" date label for the header badge.
     */
    function formatTodayTomorrow() {
      var now = new Date();
      var tomorrow = new Date(now);
      tomorrow.setDate(tomorrow.getDate() + 1);
      return 'Today ' + now.getDate() + ' ' + MONTH_NAMES[now.getMonth()] +
             ' + Tomorrow ' + tomorrow.getDate() + ' ' + MONTH_NAMES[tomorrow.getMonth()];
    }


    // ============================================================
    // DYNAMIC LAYOUT CALCULATION
    // ============================================================

    function calculateLayout(dogCount) {
      var cols, gap, fs;

      if (dogCount <= 2) {
        cols = 2; gap = 14; fs = 1.15;
      } else if (dogCount <= 4) {
        cols = 2; gap = 12; fs = 1.1;
      } else if (dogCount <= 6) {
        cols = 3; gap = 12; fs = 1.05;
      } else if (dogCount <= 9) {
        cols = 3; gap = 10; fs = 1.0;
      } else if (dogCount <= 12) {
        cols = 4; gap = 10; fs = 0.95;
      } else if (dogCount <= 16) {
        cols = 4; gap = 8; fs = 0.85;
      } else if (dogCount <= 20) {
        cols = 5; gap = 8; fs = 0.8;
      } else if (dogCount <= 25) {
        cols = 5; gap = 7; fs = 0.75;
      } else {
        cols = 6; gap = 6; fs = 0.7;
      }

      // Safety check: ensure cards have at least ~120px height
      var viewportHeight = window.innerHeight || 1080;
      var availableHeight = viewportHeight - 56 - 28 - 26 - 42; // header + footer + padding + gaps
      var rows = Math.ceil(dogCount / cols);
      var cardHeight = (availableHeight - (rows - 1) * gap) / rows;
      if (cardHeight < 120 && cols < 6) {
        cols++;
        rows = Math.ceil(dogCount / cols);
        fs = Math.max(fs - 0.05, 0.65);
      }

      var root = document.documentElement;
      root.style.setProperty('--card-cols', cols);
      root.style.setProperty('--card-rows', rows);
      root.style.setProperty('--card-gap', gap + 'px');
      root.style.setProperty('--fs', fs);

      return { cols: cols, rows: rows, gap: gap, fs: fs };
    }


    // ============================================================
    // SVG ICONS
    // ============================================================

    function pawIconSVG() {
      return '<svg viewBox="0 0 24 24"><ellipse cx="8" cy="6.5" rx="2.2" ry="2.8"/>' +
        '<ellipse cx="16" cy="6.5" rx="2.2" ry="2.8"/>' +
        '<ellipse cx="4.5" cy="11.5" rx="2" ry="2.5"/>' +
        '<ellipse cx="19.5" cy="11.5" rx="2" ry="2.5"/>' +
        '<path d="M12 22c-3.5 0-6.5-2.5-7-5.5-.3-1.8.5-3.5 2-4.5 1-.7 2.2-1 3.3-1h3.4c1.1 0 2.3.3 3.3 1 1.5 1 2.3 2.7 2 4.5-.5 3-3.5 5.5-7 5.5z"/></svg>';
    }

    var FOOD_TYPE_MAP = {
      'Kibble': {
        cls: 'kibble', label: 'Kibble',
        icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7 2 3 6 3 11c0 3 1.5 5.5 4 7v2c0 .6.4 1 1 1h8c.6 0 1-.4 1-1v-2c2.5-1.5 4-4 4-7 0-5-4-9-9-9zm-1 15h-1v-2h1v2zm3 0h-1v-2h1v2zm1.5-4.5c-.8.5-1.5 1-1.5 1.5h-4c0-.5-.7-1-1.5-1.5C7.5 12 7 10.5 7 9.5 7 7 9.2 5 12 5s5 2 5 4.5c0 1-.5 2.5-1.5 3z"/></svg>'
      },
      'Wet Food - Sachet/Tray': {
        cls: 'wet', label: 'Wet — Sachet',
        icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7z"/><circle cx="12" cy="12" r="4"/></svg>'
      },
      'Wet Food - Tin': {
        cls: 'tin', label: 'Wet — Tin',
        icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.1 2 5 3.3 5 5v14c0 1.7 3.1 3 7 3s7-1.3 7-3V5c0-1.7-3.1-3-7-3zm0 2c3.3 0 5 .9 5 1s-1.7 1-5 1-5-.9-5-1 1.7-1 5-1zm5 15c0 .1-1.7 1-5 1s-5-.9-5-1V7.9c1.2.7 3 1.1 5 1.1s3.8-.4 5-1.1V19z"/></svg>'
      },
      'Pre-Portioned by parents': {
        cls: 'parent', label: 'Pre-Portioned',
        icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 12 7.4l3.38 4.6L17 10.83 14.92 8H20v6z"/></svg>'
      },
      'Special Requirements': {
        cls: 'special', label: 'Special',
        icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L1 21h22L12 2zm0 4l7.5 13h-15L12 6zm-1 6v4h2v-4h-2zm0 5v2h2v-2h-2z"/></svg>'
      }
    };

    var medIconSVG = '<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>';
    var warningIconSVG = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>';


    // ============================================================
    // CARD BUILDERS
    // ============================================================

    function getTypeBadgeLabel(type) {
      return type === 'school' ? 'School' : 'Holiday';
    }

    function buildFoodTags(foodTypes) {
      if (!foodTypes || foodTypes.length === 0) return '';
      var html = '<div class="food-tags">';
      for (var i = 0; i < foodTypes.length; i++) {
        var type = foodTypes[i];
        var info = FOOD_TYPE_MAP[type];
        if (info) {
          html += '<span class="food-tag ' + info.cls + '">' + info.icon + escapeHtml(info.label) + '</span>';
        } else {
          html += '<span class="food-tag special">' + FOOD_TYPE_MAP['Special Requirements'].icon + escapeHtml(type) + '</span>';
        }
      }
      return html + '</div>';
    }

    function buildQuantityRows(feeding) {
      var html = '';
      if (feeding.kibbleSummary) {
        html += '<div class="quantity-row"><span class="quantity-label">Kibble</span><span class="quantity-value">' + escapeHtml(feeding.kibbleSummary) + '</span></div>';
      }
      if (feeding.wetFood) {
        html += '<div class="quantity-row"><span class="quantity-label">Wet</span><span class="quantity-value">' + escapeHtml(feeding.wetFood) + '</span></div>';
      }
      if (feeding.tinFood) {
        html += '<div class="quantity-row"><span class="quantity-label">Tin</span><span class="quantity-value">' + escapeHtml(feeding.tinFood) + '</span></div>';
      }
      return html;
    }

    function buildNotesBlock(notes) {
      if (!notes) return '';
      return '<div class="notes-block"><div class="notes-label">Notes</div><div class="notes-text">' + escapeHtml(notes) + '</div></div>';
    }

    function buildMedAlert(feeding) {
      if (!feeding || feeding.medication !== 'Yes') return '';
      var details = feeding.medicationDetails || 'See medication bag / check with owner';
      return '<div class="med-alert">' +
               '<div class="med-alert-icon">' + medIconSVG + '</div>' +
               '<div class="med-alert-content">' +
                 '<div class="med-alert-title">\u2695 Medication Required</div>' +
                 '<div class="med-alert-text">' + escapeHtml(details) + '</div>' +
               '</div>' +
             '</div>';
    }

    function buildNoMatchBanner() {
      return '<div class="no-match-banner">' + warningIconSVG +
             '<span class="no-match-text">No feeding record — check JotForm</span></div>';
    }

    function formatMealsBadge(mealsStr) {
      if (!mealsStr) return '—';
      var lower = mealsStr.toLowerCase();
      var num = '?';
      if (lower.indexOf('one') !== -1 || lower.indexOf('1') !== -1) num = '1';
      else if (lower.indexOf('two') !== -1 || lower.indexOf('2') !== -1) num = '2';
      else if (lower.indexOf('three') !== -1 || lower.indexOf('3') !== -1) num = '3';
      return num + 'x/day';
    }

    function buildDogCard(dog) {
      var feeding = dog.feeding;
      var stayType = dog.type || 'boarding';
      var headerClass = 'card-header' + (stayType === 'school' ? ' school' : '');

      var html = '<div class="dog-card">';
      html += '<div class="' + headerClass + '">' +
                '<div class="dog-identity">' +
                  '<div class="paw-icon">' + pawIconSVG() + '</div>' +
                  '<div><div class="dog-name">' + escapeHtml(dog.dogName) +
                    ' <span class="card-type-badge">' + getTypeBadgeLabel(stayType) + '</span>' +
                  '</div></div>' +
                '</div>' +
                '<div class="meals-badge">' + (feeding ? formatMealsBadge(feeding.mealsPerDay) : '—') + '</div>' +
              '</div>';

      html += '<div class="card-body">';
      if (dog.matched && feeding) {
        html += buildFoodTags(feeding.foodTypes);
        html += buildQuantityRows(feeding);
        html += buildNotesBlock(feeding.specialNotes);
        html += buildMedAlert(feeding);
      } else {
        html += buildNoMatchBanner();
      }
      html += '</div></div>';
      return html;
    }


    // ============================================================
    // RENDER
    // ============================================================

    function renderData(data) {
      var loadingEl = document.getElementById('loadingState');
      var gridEl = document.getElementById('cardsGrid');
      var emptyEl = document.getElementById('emptyState');
      var errorEl = document.getElementById('errorBanner');
      var feedingWarnEl = document.getElementById('feedingWarning');
      var dateRangeEl = document.getElementById('dateRangeText');
      var lastUpdatedEl = document.getElementById('lastUpdated');
      var dogCountEl = document.getElementById('dogCountText');

      loadingEl.style.display = 'none';

      if (data.error) {
        errorEl.textContent = data.error;
        errorEl.style.display = 'block';
      } else {
        errorEl.style.display = 'none';
      }

      if (data.feedingError) {
        feedingWarnEl.textContent = data.feedingError;
        feedingWarnEl.style.display = 'block';
      } else {
        feedingWarnEl.style.display = 'none';
      }

      // Show "Today + Tomorrow" in the date badge instead of full range
      dateRangeEl.textContent = formatTodayTomorrow();

      if (data.lastUpdated) {
        lastUpdatedEl.textContent = formatLastUpdated(data.lastUpdated);
      }

      // Filter to today's stays + tomorrow's arrivals, then deduplicate
      var filtered = data.dogs ? filterTodayTomorrow(data.dogs) : [];
      var dogs = deduplicateDogs(filtered);
      var count = dogs.length;
      dogCountEl.textContent = count + ' Dog' + (count !== 1 ? 's' : '') + ' Boarding';

      if (count > 0) {
        calculateLayout(count);
        gridEl.style.display = 'grid';
        emptyEl.style.display = 'none';

        var html = '';
        for (var i = 0; i < count; i++) {
          html += buildDogCard(dogs[i]);
        }
        gridEl.innerHTML = html;
      } else {
        gridEl.style.display = 'none';
        emptyEl.style.display = 'flex';
      }
    }


    // ============================================================
    // DATA LOADING & REFRESH
    // ============================================================

    function loadData() {
      var gridEl = document.getElementById('cardsGrid');
      if (!gridEl.innerHTML) {
        document.getElementById('loadingState').style.display = 'flex';
      }

      var fetchUrl = API_URL + (API_URL.indexOf('?') === -1 ? '?' : '&') + 'mode=feeding&token=' + encodeURIComponent(API_TOKEN);

      fetch(fetchUrl)
        .then(function(response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        })
        .then(function(data) {
          renderData(data);
          scheduleNextRefresh();
        })
        .catch(function(err) {
          renderData({
            dogs: [],
            dogCount: 0,
            dateRange: { start: '', end: '' },
            lastUpdated: new Date().toISOString(),
            error: 'Connection error: ' + (err.message || err),
            feedingError: null
          });
          scheduleNextRefresh();
        });
    }

    function scheduleNextRefresh() {
      nextRefreshTime = Date.now() + REFRESH_INTERVAL_MS;
      if (countdownTimer) clearInterval(countdownTimer);

      countdownTimer = setInterval(function() {
        var remaining = nextRefreshTime - Date.now();
        if (remaining <= 0) {
          clearInterval(countdownTimer);
          loadData();
          return;
        }
        var hours = Math.floor(remaining / (1000 * 60 * 60));
        var mins = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
        var secs = Math.floor((remaining % (1000 * 60)) / 1000);

        document.getElementById('countdown').textContent =
          (hours > 0 ? hours + 'h ' : '') +
          ('0' + mins).slice(-2) + 'm ' +
          ('0' + secs).slice(-2) + 's';
      }, 1000);
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadData();
    });
  </script>
